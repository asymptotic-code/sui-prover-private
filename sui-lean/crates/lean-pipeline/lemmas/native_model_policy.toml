[[rule]]
package = "Sui"
module = "vec_set"
function = "*"
source = "handwritten"
classification = "trusted"
justification = "VecSet is modeled as a structural record over List, which admits duplicate elements the API cannot produce. Uniqueness is enforced off-model by the defining module (insert aborts on a present key, from_keys aborts on duplicates) plus Move field encapsulation: contents is private, so only sui::vec_set can construct or mutate a VecSet. The model names that invariant as Vec_set.Inv and proves establishment and preservation for every writer; Inv is supplied as a hypothesis, never assumed as an axiom. See plans/lean-pipeline/container-datatype-invariants.md."

[[rule]]
package = "Sui"
module = "vec_map"
function = "*"
source = "handwritten"
classification = "trusted"
justification = "VecMap is modeled as a structural record over a list of entries, which admits duplicate keys the API cannot produce. Uniqueness is enforced off-model by the defining module (insert upserts, remove deletes the single entry at get_idx) plus Move field encapsulation: contents is private, so only sui::vec_map can construct or mutate a VecMap. The model names that invariant as Vec_map.Inv and proves establishment and preservation for every writer; Inv is supplied as a hypothesis, never assumed as an axiom. See plans/lean-pipeline/container-datatype-invariants.md."

