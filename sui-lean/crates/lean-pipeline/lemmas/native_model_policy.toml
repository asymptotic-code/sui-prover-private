version = 1

[[rule]]
package = "Sui"
module = "accumulator"
function = "emit_deposit_event"
source = "handwritten"
classification = "trusted"
justification = "Accumulator events are not user events. The VM native (sui-execution/latest/sui-move-natives/src/accumulator.rs) forwards to ObjectRuntime::emit_accumulator_event, which pushes onto state.accumulator_events and the accumulator merge/split totals and never touches state.events -- the vector take_user_events returns and test_scenario counts into num_user_events. So, unlike event::emit, this native must NOT bump the World's tx_user_events, and the identity model is the faithful one. test_scenario::end_transaction discards accumulator_events outright, and no object, dynamic-field, bag or funds_accumulator ledger state moves, so nothing else the World represents changes either. Residual disclosed gap: emit_accumulator_event can raise ARITHMETIC_ERROR when a key's cumulative merges overflow u64 inside one transaction and the model has no .aborts companion -- the same unmodeled-abort shape event::emit already carries here (max_num_event_emit), and unreachable today because the native is public(package) in sui::accumulator with no caller anywhere in the framework."

