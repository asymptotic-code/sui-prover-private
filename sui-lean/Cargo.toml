[workspace]
resolver = "2"
members = [
  "crates/sui-lean",
  "crates/move-prover-lean-backend",
  "crates/intermediate-theorem-format",
  "crates/stackless-to-intermediate",
  "crates/lean-pipeline",
]

default-members = ["crates/sui-lean"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Asymptotic <info@asymptotic.tech>"]
license = "Apache-2.0"
publish = false

[profile.release]
debug = 1

[workspace.lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "deny"
unused_mut = "deny"

[workspace.dependencies]
# Local crates
sui-lean = { path = "crates/sui-lean" }
move-prover-lean-backend = { path = "crates/move-prover-lean-backend" }
intermediate-theorem-format = { path = "crates/intermediate-theorem-format" }
stackless-to-intermediate = { path = "crates/stackless-to-intermediate" }
lean-pipeline = { path = "crates/lean-pipeline" }

# Move dependencies from this repository
move-model = { path = "../crates/move-model" }
move-stackless-bytecode = { path = "../crates/move-stackless-bytecode" }

# Move dependencies from sui
move-package = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-compiler = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-core-types = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-symbol-pool = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-binary-format = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-unit-test = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-vm-runtime = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
move-command-line-common = { git = "https://github.com/asymptotic-code/sui", branch = "next" }
bcs = "0.1.6"

# Common dependencies
anyhow = "1.0.71"
clap = { version = "4.4", features = ["derive", "wrap_help", "env"] }
colored = "2.0.0"
tracing = "0.1.37"
toml = { version = "0.7.4", features = ["preserve_order"] }
itertools = "0.13.0"
telemetry-subscribers = "0.4.1"
log = { version = "0.4.14", features = ["serde"] }
num = "0.4.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha2 = "0.9.9"
codespan = "0.11.1"
codespan-reporting = "0.11.1"
termcolor = "1.1.3"
ethnum = "1.0.4"
petgraph = "0.8.3"
tokio = { version = "1.43.0", features = ["full"] }
indexmap = "2.12.0"
fs4 = "0.13.1"
libc = "0.2"
tempfile = "3"
stacker = "0.1.24"
